backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/news"
public_folder: "/assets/images/news"

collections:
  - name: "news"
    label: "お知らせ"
    label_singular: "お知らせ項目"
    file: "data/news.json"
    extension: "json"
    format: "json"
    fields:
      - { label: "お知らせリスト", name: "news", widget: "list", fields: [
          { label: "日付", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
          { label: "タイトル", name: "title", widget: "string" },
          { label: "本文", name: "body", widget: "text" },
          { label: "URL（任意）", name: "url", widget: "string", required: false }
        ]}
