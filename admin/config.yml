backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news"
    label: "お知らせ"
    folder: "data/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "日付", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "カテゴリ", name: "category", widget: "select", options: ["お知らせ", "講座", "催し"] }
      - { label: "本文", name: "body", widget: "text" }
      - { label: "URL（任意）", name: "url", widget: "string", required: false }
