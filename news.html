  <style>
    /* ===== ページ固有スタイル ===== */

    /* パンくずリスト */
    .breadcrumb {
      background: #f5f7f5;
      padding: 12px 0;
      font-size: 0.82em;
      color: #666;
    }
    .breadcrumb-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .breadcrumb ol {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      margin: 0; padding: 0;
    }
    .breadcrumb li + li::before {
      content: "›";
      margin: 0 8px;
      color: #aaa;
    }
    .breadcrumb a { color: var(--primary); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* ページヘッダー */
    .page-hero {
      background: linear-gradient(135deg, var(--primary) 0%, #1a5c38 100%);
      color: var(--white);
      padding: 60px 24px;
      text-align: center;
    }
    .page-hero-label {
      font-size: 0.8em;
      letter-spacing: 0.15em;
      opacity: 0.8;
      margin-bottom: 12px;
    }
    .page-hero-title {
      font-size: clamp(1.6em, 4vw, 2.4em);
      font-weight: 900;
      line-height: 1.3;
      margin: 0;
    }

    /* メインコンテンツ */
    .news-page-wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* カテゴリタブ */
    .news-tabs-bar {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #dde8de;
      margin-bottom: 32px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .news-tabs-bar::-webkit-scrollbar { display: none; }
    .news-tab-btn {
      padding: 13px 24px;
      font-size: 0.9em;
      font-weight: 700;
      color: #666;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
    }
    .news-tab-btn:hover { color: var(--primary); }
    .news-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab-count {
      display: inline-block;
      background: #e8f0e8;
      color: #555;
      font-size: 0.75em;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 5px;
      vertical-align: middle;
    }
    .news-tab-btn.active .tab-count {
      background: var(--primary);
      color: var(--white);
    }

    /* お知らせリスト */
    .news-list-area {
      min-height: 240px;
    }
    .news-item {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid #e8eee8;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }
    .news-item:first-child { border-top: 1px solid #e8eee8; }
    .news-item:hover { background: #f8faf8; margin: 0 -12px; padding: 18px 12px; }
    .news-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .news-date {
      font-size: 0.85em;
      color: #888;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .news-badge {
      display: inline-block;
      font-size: 0.72em;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 3px;
      white-space: nowrap;
      letter-spacing: 0.03em;
    }
    .badge-news    { background: #e8f5ee; color: #1a6b3a; }
    .badge-kouza   { background: #e8f0fa; color: #1a4a8a; }
    .badge-moyooshi { background: #fff0e0; color: #a05a00; }

    .news-title {
      font-size: 0.97em;
      color: var(--text-dark);
      line-height: 1.6;
      flex: 1;
    }
    .news-item:hover .news-title { color: var(--primary); }

    /* 空・ローディング */
    .news-state {
      text-align: center;
      padding: 48px 0;
      color: #aaa;
      font-size: 0.95em;
    }

    /* アコーディオンアイテム（URLなし・本文あり） */
    .news-item-accordion {
      padding: 18px 0;
      border-bottom: 1px solid #e8eee8;
      cursor: pointer;
      transition: background 0.15s;
    }
    .news-item-accordion:first-child { border-top: 1px solid #e8eee8; }
    .news-item-accordion:hover { background: #f8faf8; }
    .news-item-accordion:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
    .news-accordion-header {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .news-accordion-chevron {
      font-size: 0.78em;
      color: var(--primary);
      flex-shrink: 0;
      margin-left: auto;
      padding-left: 8px;
      transition: transform 0.25s;
    }
    .news-item-accordion[aria-expanded="true"] .news-accordion-chevron {
      transform: rotate(180deg);
    }
    .news-accordion-body {
      display: none;
      margin-top: 14px;
      padding: 14px 0 4px;
      color: #555;
      font-size: 0.93em;
      line-height: 1.85;
      white-space: pre-wrap;
      border-top: 1px dashed #dde8de;
    }
    .news-item-accordion[aria-expanded="true"] .news-accordion-body {
      display: block;
    }
    .news-item-accordion:hover .news-title { color: var(--primary); }

    /* ページネーション */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 40px;
      flex-wrap: wrap;
    }
    .pager-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 40px;
      padding: 0 14px;
      border: 1px solid #dde8de;
      border-radius: 6px;
      background: var(--white);
      color: #555;
      font-size: 0.88em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    .pager-btn:hover:not(:disabled):not(.active) {
      background: #f0f8f2;
      border-color: var(--primary);
      color: var(--primary);
    }
    .pager-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }
    .pager-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .pager-info {
      font-size: 0.82em;
      color: #888;
      margin-left: 8px;
    }

    @media (max-width: 600px) {
      .news-page-wrap { padding: 32px 16px 60px; }
      .news-item { flex-direction: column; gap: 6px; }
      .news-accordion-header { flex-direction: column; gap: 6px; }
      .news-accordion-chevron { margin-left: 0; }
      .news-meta { gap: 8px; }
      .page-hero { padding: 44px 20px; }
    }
  </style>

  <script>

        { date: "2026-04-15", category: "事業案内", title: "介護予防講座「健康体操で元気に！」開催のご案内", url: "",
          body: "健康体操で元気に！\n\n【日時】令和8年4月25日（金）10:00〜11:30\n【場所】大宜味村地域福祉センター 多目的ホール\n【内容】ストレッチ・軽体操・血圧測定\n【対象】村内在住の65歳以上の方\n【参加費】無料\n\nお申し込みは社協（0980-44-3800）まで。" },
        { date: "2026-04-05", category: "事業案内", title: "ボランティア入門講座（5月開催）参加者募集", url: "#", body: "" },
        { date: "2026-03-20", category: "事業案内", title: "発達相談サポート講座「子育てのヒント」開催報告", url: "#", body: "" },
        { date: "2026-03-10", category: "事業案内", title: "移動支援従事者研修のご案内", url: "#", body: "" }
      ],
      moyooshi: [
        { date: "2026-04-29", category: "催し", title: "くがにサロン 春の交流会のご案内", url: "",
          body: "くがにサロン 春の交流会を開催します。\n\n【日時】令和8年4月29日（火・祝）13:00〜15:00\n【場所】くがに地区集会所\n【内容】茶話会・季節の手芸・昔遊び体験\n【対象】どなたでも\n【参加費】無料\n\n当日直接お越しください。詳細は社協（0980-44-3800）まで。" },
        { date: "2026-04-18", category: "催し", title: "フードパントリー（食料支援）配布会 4月のお知らせ", url: "#", body: "" },
        { date: "2026-04-12", category: "催し", title: "大宜味共同店ネットワーク 春まつり参加のご案内", url: "#", body: "" },
        { date: "2026-03-22", category: "催し", title: "地域福祉活動 ボランティア清掃イベント 開催報告", url: "#", body: "" },
        { date: "2026-03-05", category: "催し", title: "令和7年度 社協総会 開催のご案内", url: "#", body: "" }
      ]
    };

    // ===== ニュースアプリ =====
    (function () {
      var PER_PAGE = 10;
      var allItems  = [];
      var filtered  = [];
      var currentCat  = 'all';
      var currentPage = 1;

      // カテゴリ設定
      var CAT_MAP = {
        news:     { label: 'お知らせ', cls: 'badge-news' },
        kouza:    { label: '事業案内', cls: 'badge-kouza' },
        moyooshi: { label: '催し',     cls: 'badge-moyooshi' },
        report:   { label: '報告・資料', cls: 'badge-report' }
      };

      // YYYY-MM-DD → YYYY.MM.DD
      function fmtDate(d) {
        return d.replace(/-/g, '.');
      }

      // HTML特殊文字エスケープ
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // URLが空かどうか判定
      function isEmptyUrl(url) {
        return !url || url === '#' || url.trim() === '';
      }

      // カテゴリキー取得
      function catKey(item) {
        if (item.category === 'お知らせ') return 'news';
        if (item.category === '事業案内') return 'kouza';
        if (item.category === '催し')     return 'moyooshi';
        if (item.category === '報告・資料') return 'report';
        return 'news';
      }

      // データをフラット化して日付降順ソート
      function flatten(data) {
        var arr = [];
        ['news', 'kouza', 'moyooshi'].forEach(function (k) {
          if (Array.isArray(data[k])) {
            data[k].forEach(function (item) { arr.push(item); });
          }
        });
        arr.sort(function (a, b) { return b.date.localeCompare(a.date); });
        return arr;
      }

      // カウントバッジ更新
      function updateCounts(items) {
        var counts = { news: 0, kouza: 0, moyooshi: 0 };
        items.forEach(function (item) { counts[catKey(item)]++; });
        document.getElementById('count-all').textContent    = items.length;
        document.getElementById('count-news').textContent   = counts.news;
        document.getElementById('count-kouza').textContent  = counts.kouza;
        document.getElementById('count-moyooshi').textContent = counts.moyooshi;
      }

      // リスト描画
      function renderList() {
        var area = document.getElementById('news-list-area');
        var start = (currentPage - 1) * PER_PAGE;
        var page  = filtered.slice(start, start + PER_PAGE);

        if (filtered.length === 0) {
          area.innerHTML = '<p class="news-state">該当するお知らせはありません。</p>';
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        var html = '';
        page.forEach(function (item) {
          var ck     = catKey(item);
          var cfg    = CAT_MAP[ck];
          var hasPdf = !!(item.pdf && item.pdf.trim());
          var hasUrl = !isEmptyUrl(item.url);
          var hasBody = !!(item.body && item.body.trim());

          var metaHtml = '<span class="news-meta">'
            + '<span class="news-date">' + fmtDate(item.date) + '</span>'
            + '<span class="news-badge ' + cfg.cls + '">' + cfg.label + '</span>'
            + '</span>';
          var pdfBtnHtml = hasPdf
            ? '<a href="' + escapeHtml(item.pdf) + '" class="news-pdf-btn" target="_blank" rel="noopener noreferrer">📄 PDFを見る</a>'
            : '';

          if (!hasUrl && hasBody) {
            // URLなし＋本文あり → アコーディオン（PDFボタンはヘッダーに表示）
            html += '<div class="news-item-accordion" tabindex="0" role="button" aria-expanded="false">';
            html +=   '<div class="news-accordion-header">';
            html +=     metaHtml;
            html +=     '<span class="news-title">' + escapeHtml(item.title) + '</span>';
            html +=     pdfBtnHtml;
            html +=     '<span class="news-accordion-chevron" aria-hidden="true">▼</span>';
            html +=   '</div>';
            html +=   '<div class="news-accordion-body">' + escapeHtml(item.body) + '</div>';
            html += '</div>';
          } else if (hasUrl && !hasPdf) {
            // URLあり・PDFなし → <a>で全体リンク
            html += '<a href="' + escapeHtml(item.url) + '" class="news-item">';
            html +=   metaHtml;
            html +=   '<span class="news-title">' + escapeHtml(item.title) + '</span>';
            html += '</a>';
          } else {
            // PDFあり（URLの有無は問わない）or URLなし・PDFなし・本文なし
            var titleHtml = hasUrl
              ? '<a href="' + escapeHtml(item.url) + '" class="news-title">' + escapeHtml(item.title) + '</a>'
              : '<span class="news-title">' + escapeHtml(item.title) + '</span>';
            html += '<div class="news-item">';
            html +=   metaHtml;
            html +=   titleHtml;
            html +=   pdfBtnHtml;
            html += '</div>';
          }
        });
        area.innerHTML = html;

        // アコーディオンのトグル処理
        area.querySelectorAll('.news-item-accordion').forEach(function (el) {
          el.addEventListener('click', function () {
            var expanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', String(!expanded));
          });
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              var expanded = this.getAttribute('aria-expanded') === 'true';
              this.setAttribute('aria-expanded', String(!expanded));
            }
          });
        });

        // アコーディオン内PDFボタンのクリックがアコーディオントグルに伝播しないようにする
        area.querySelectorAll('.news-item-accordion .news-pdf-btn').forEach(function (btn) {
          btn.addEventListener('click', function (e) { e.stopPropagation(); });
        });

        renderPagination();
      }

      // ページネーション描画
      function renderPagination() {
        var pag    = document.getElementById('pagination');
        var total  = Math.ceil(filtered.length / PER_PAGE);
        if (total <= 1) { pag.innerHTML = ''; return; }

        var html = '';
        // 前へ
        html += '<button class="pager-btn" id="pager-prev" aria-label="前のページ"'
              + (currentPage === 1 ? ' disabled' : '') + '>◀ 前へ</button>';

        // ページ番号（最大7ボタン表示）
        var range = pageRange(currentPage, total);
        range.forEach(function (p) {
          if (p === '…') {
            html += '<span style="padding:0 4px;color:#aaa;line-height:40px;">…</span>';
          } else {
            html += '<button class="pager-btn' + (p === currentPage ? ' active' : '')
                  + '" data-page="' + p + '" aria-label="' + p + 'ページ目"'
                  + (p === currentPage ? ' aria-current="page"' : '') + '>' + p + '</button>';
          }
        });

        // 次へ
        html += '<button class="pager-btn" id="pager-next" aria-label="次のページ"'
              + (currentPage === total ? ' disabled' : '') + '>次へ ▶</button>';

        html += '<span class="pager-info">' + currentPage + ' / ' + total + 'ページ</span>';

        pag.innerHTML = html;

        // ページ番号クリック
        pag.querySelectorAll('[data-page]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            goPage(parseInt(this.dataset.page));
          });
        });
        var prev = document.getElementById('pager-prev');
        var next = document.getElementById('pager-next');
        if (prev) prev.addEventListener('click', function () { goPage(currentPage - 1); });
        if (next) next.addEventListener('click', function () { goPage(currentPage + 1); });
      }

      // ページ番号レンジ生成
      function pageRange(cur, total) {
        if (total <= 7) {
          var arr = [];
          for (var i = 1; i <= total; i++) arr.push(i);
          return arr;
        }
        var pages = [1];
        if (cur > 3) pages.push('…');
        for (var p = Math.max(2, cur - 1); p <= Math.min(total - 1, cur + 1); p++) pages.push(p);
        if (cur < total - 2) pages.push('…');
        pages.push(total);
        return pages;
      }

      // ページ移動
      function goPage(p) {
        currentPage = p;
        renderList();
        document.getElementById('news-list-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      // タブ切り替え
      function setTab(cat) {
        currentCat  = cat;
        currentPage = 1;
        filtered = cat === 'all'
          ? allItems.slice()
          : allItems.filter(function (item) { return catKey(item) === cat; });

        document.querySelectorAll('.news-tab-btn').forEach(function (btn) {
          var active = btn.dataset.cat === cat;
          btn.classList.toggle('active', active);
          btn.setAttribute('aria-selected', String(active));
        });

        renderList();
      }

      // タブボタンにイベント登録
      document.querySelectorAll('.news-tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { setTab(this.dataset.cat); });
      });

      // データ読み込み
      function init(data) {
        allItems = flatten(data);
        updateCounts(allItems);
        setTab('all');
      }

      fetch('data/news.json')
        .then(function (r) {
          if (!r.ok) throw new Error('fetch failed');
          return r.json();
        })
        .then(function (data) {
          // news.json は配列形式なのでオブジェクト形式に変換する
          if (Array.isArray(data)) {
            var catMap = { 'お知らせ': 'news', '事業案内': 'kouza', '催し': 'moyooshi', '報告・資料': 'report' };
            var obj = { news: [], kouza: [], moyooshi: [], report: [] };
            data.forEach(function (item) {
              var key = catMap[item.category] || 'news';
              obj[key].push(item);
            });
            init(obj);
          } else {
            init(data);
          }
        })
        .catch(function () { init(FALLBACK_DATA); });

    })();
  </script>
</body>
</html>
